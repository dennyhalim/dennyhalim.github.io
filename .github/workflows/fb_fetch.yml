name: Weekly Run

on:
  #schedule:
    # Every Sunday at 00:00 UTC = weekly
    # Use https://crontab.guru to change it
    #- cron: '0 5 * * 0'
  workflow_dispatch: # lets you click Run Now to test

jobs:
  run-script:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install mods
        run: |
          # python -m pip install --upgrade pip
          pip install yt-dlp python-telegram-bot requests playwright yt-dlp requests google-api-python-client google-auth-oauthlib google-auth-httplib2
          playwright install chromium
          # OR if you have requirements.txt, use this instead:
          # pip install -r requirements.txt

      - name: Run python script
        env:
          # If your script needs secrets, add them in Repo > Settings > Secrets
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py
